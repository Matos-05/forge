<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,Roboto,sans-serif}
body{padding:0 env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;padding-top:calc(12px + env(safe-area-inset-top)) !important;background:rgba(10,11,13,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 16px 10px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--acc),var(--acc2) 55%,var(--ok)) 1}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 2px;font-size:17px;font-weight:800}
.big{display:block;width:100%;text-align:left;color:var(--txt);font:inherit;cursor:pointer}

.set{display:grid;grid-template-columns:58px 44px 1fr 44px 52px;gap:6px;align-items:center;margin-top:8px}
.set .n{font-size:13px;color:var(--mut)}
.chk{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:20px;font-weight:700}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#06130a}
.set.done .inp{border-color:rgba(196,248,42,.55)}
.btn{display:block;width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:17px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;margin-top:6px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);text-transform:none;letter-spacing:0;font-weight:700}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(239,68,68,.4);text-transform:none;letter-spacing:0}
.note{width:100%;margin-top:10px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:#0b0d11;color:var(--txt);font-family:inherit;font-size:14px;line-height:1.3;padding:8px 10px;resize:vertical}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(10,11,13,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}

nav button svg{width:24px;height:24px}

#timer{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:7;background:#2a1208;border:1px solid var(--acc);border-radius:16px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:620px;margin:0 auto}

.pill.up{background:var(--oks)}.pill.down{background:var(--bads)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}

.sheet{background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:85vh;overflow:auto}

.meal.on .box{background:var(--ok);border-color:var(--ok);color:#06130a}
.meal.on h3{text-decoration:line-through;color:var(--mut)}

.water{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.water span{width:22px;height:30px;border-radius:4px 4px 8px 8px;border:2px solid #38bdf8;opacity:.35}
.water span.f{background:#38bdf8;opacity:1}
.cl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.cl:first-of-type{border-top:0}
.cl .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:transparent}
.cl.on .box{background:var(--ok);border-color:var(--ok);color:#06130a}

<script>
(function(){
"use strict";
// ---------- Programme ----------
// [id, nom, séries, min, max, repos(s), incrément(kg), type, consigne]
// type: b=barre, h=haltère (kg par haltère), m=machine, c=poids du corps, s=secondes, e=élastique

// ---------- Stockage local + synchronisation Cloudflare ----------
const LDB={docs:{},listeners:[]};
try{LDB.docs=JSON.parse(localStorage.getItem("forge_docs")||"{}")}catch(e){LDB.docs={}}
function ldbSave(){try{localStorage.setItem("forge_docs",JSON.stringify(LDB.docs))}catch(e){}}
function ldbNotify(){LDB.listeners.slice().forEach(l=>{try{l()}catch(e){console.error(e)}})}
function ldbPut(path,data){LDB.docs[path]={data:data,updatedAt:Math.max(Date.now(),((LDB.docs[path]||{}).updatedAt||0)+1),dirty:true};ldbSave();ldbNotify();scheduleSync()}
function mkSnapDoc(path){const r=LDB.docs[path];const ex=!!(r&&!r.deleted&&r.data);const d=ex?JSON.parse(JSON.stringify(r.data)):undefined;return {id:path.split("/").pop(),exists:ex,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}}
function ldbQuery(col,ord,lim){const n=col.split("/").length+1;let arr=Object.keys(LDB.docs).filter(p=>p.startsWith(col+"/")&&p.split("/").length===n&&!LDB.docs[p].deleted&&LDB.docs[p].data).map(mkSnapDoc);
 if(ord)arr.sort((a,b)=>{const x=a.data()[ord.f],y=b.data()[ord.f];return (x<y?-1:x>y?1:0)*(ord.d==="desc"?-1:1)});if(lim)arr=arr.slice(0,lim);
 return {docs:arr,size:arr.length,empty:!arr.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}}
const LocalDB={
 doc(path){return {set:async d=>ldbPut(path,JSON.parse(JSON.stringify(d))),get:async()=>mkSnapDoc(path),onSnapshot(cb){const f=()=>cb(mkSnapDoc(path));LDB.listeners.push(f);setTimeout(f,0);return()=>{LDB.listeners=LDB.listeners.filter(x=>x!==f)}}}},
 collection(col){const q=(ord,lim)=>({orderBy:(f,d)=>q({f:f,d:d},lim),limit:n=>q(ord,n),get:async()=>ldbQuery(col,ord,lim),onSnapshot(cb){const f=()=>cb(ldbQuery(col,ord,lim));LDB.listeners.push(f);setTimeout(f,0);return()=>{LDB.listeners=LDB.listeners.filter(x=>x!==f)}},doc:id=>LocalDB.doc(col+"/"+id)});return q(null,null)}
};
const SY={token:localStorage.getItem("forge_token")||"",since:+(localStorage.getItem("forge_since")||0),state:"idle",lastOk:+(localStorage.getItem("forge_lastok")||0)};
let syT=null;function scheduleSync(){clearTimeout(syT);syT=setTimeout(doSync,1500)}
async function doSync(){
 if(!SY.token){SY.state="notoken";setStatus();return}
 if(SY.state==="busy")return;
 if(navigator.onLine===false){SY.state="offline";setStatus();return}
 SY.state="busy";setStatus();
 const dirty=Object.entries(LDB.docs).filter(([p,r])=>r.dirty).map(([p,r])=>({path:p,data:r.data,updatedAt:r.updatedAt,deleted:!!r.deleted}));
 try{
  const res=await fetch("/api/sync",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+SY.token},body:JSON.stringify({since:SY.since,docs:dirty})});
  if(res.status===401){SY.state="badtoken";setStatus();return}
  if(!res.ok)throw new Error("HTTP "+res.status);
  const j=await res.json();
  dirty.forEach(d=>{const r=LDB.docs[d.path];if(r&&r.updatedAt===d.updatedAt)r.dirty=false});
  let changed=false;
  (j.docs||[]).forEach(d=>{const r=LDB.docs[d.path];if(!r||d.updatedAt>r.updatedAt){LDB.docs[d.path]={data:d.data,updatedAt:d.updatedAt,dirty:false,deleted:d.deleted||undefined};changed=true}});
  SY.since=Math.max(0,(j.now||Date.now())-5000);localStorage.setItem("forge_since",SY.since);
  SY.lastOk=Date.now();localStorage.setItem("forge_lastok",SY.lastOk);
  ldbSave();SY.state="ok";if(changed)ldbNotify();
 }catch(e){SY.state="offline"}
 setStatus()}
window.addEventListener("online",()=>doSync());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")doSync()});
setInterval(()=>{if(document.visibilityState==="visible")doSync()},60000);
function showSettings(){showModal('<h3>Synchronisation</h3><p class="muted">L\'app fonctionne sans réseau. Dès que tu as du réseau, elle envoie tes données sur ton serveur Cloudflare : c\'est ta sauvegarde, et c\'est ce qui me permet de les analyser.</p><label class="muted">Code de synchronisation</label><input class="inp" id="tokIn" value="'+esc(SY.token)+'" placeholder="FRG-XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off" style="font-size:16px;margin:6px 0 10px;text-align:left;padding:0 12px"><button class="btn" id="tokSave">Enregistrer et synchroniser</button><p class="muted" style="margin-top:10px">Dernière synchro réussie : '+(SY.lastOk?new Date(SY.lastOk).toLocaleString("fr-FR"):"jamais")+'</p><button class="btn sec" id="syncNow">Synchroniser maintenant</button><button class="btn sec" id="expBtn" style="margin-top:8px">Copier une sauvegarde (JSON)</button><button class="btn sec" data-close style="margin-top:8px">Fermer</button>')}
async function copyText(t,okMsg){try{await navigator.clipboard.writeText(t);showModal('<h3>Copié ✅</h3><p class="muted">'+okMsg+'</p><button class="btn" data-close>OK</button>')}catch(e){showModal('<h3>Copie impossible</h3><p class="muted">Sélectionne le texte ci-dessous et copie-le.</p><textarea class="note" style="min-height:200px">'+esc(t)+'</textarea><button class="btn sec" data-close>Fermer</button>')}}

function computeBilan(){const out=[];const d0=planDay();const t=today();const wk=weekOf(t);
 const since=n=>addDays(t,-n);
 // séances
 const ses=allSeances();const s7=ses.filter(s=>s.date>since(7)&&s.date<=t);
 if(t>=START_D)out.push(s7.length>=4?["ok","Séances",s7.length+" séances sur les 7 derniers jours : objectif atteint."]:["warn","Séances",s7.length+" séance(s) sur les 7 derniers jours (objectif 4). Garde au moins 3 séances, même courtes."]);
 // poids
 const cp=[...S.corps].filter(c=>c.poids!=null).sort((a,b)=>a.date.localeCompare(b.date));
 if(cp.length>=2){const a=cp[Math.max(0,cp.length-3)],b=cp[cp.length-1];const days=Math.max(1,(new Date(b.date)-new Date(a.date))/864e5);const rate=(b.poids-a.poids)/days*7;
  const txt="Tendance : "+(rate>0?"+":"")+fmt(rate)+" kg/semaine ("+fmt(a.poids)+" → "+fmt(b.poids)+" kg).";
  if(days>=10&&rate>-0.2)out.push(["warn","Poids",txt+" Ça stagne : baisse de 150 kcal/jour ou ajoute 2 000 pas/jour."]);
  else if(rate<-1)out.push(["warn","Poids",txt+" Trop rapide : ajoute 150 à 200 kcal/jour pour protéger ton muscle."]);
  else out.push(["ok","Poids",txt+(days<10?" Encore trop tôt pour conclure (il faut environ 2 semaines).":" Bon rythme, continue comme ça.")]);
 }else out.push(["info","Poids","Note ton poids chaque lundi dans l'onglet Corps pour suivre la tendance."]);
 const ct=[...S.corps].filter(c=>c.taille!=null).sort((a,b)=>a.date.localeCompare(b.date));
 if(ct.length>=2){const dlt=ct[ct.length-1].taille-ct[0].taille;out.push([dlt<0?"ok":"info","Tour de taille",(dlt>0?"+":"")+fmt(dlt)+" cm depuis le "+dfr(ct[0].date)+(dlt<0?" : tu perds du gras.":".")])}
 // repas
 let plan=0,eat=0,eau=0,nd=0;for(let i=1;i<=7;i++){const d=since(i-1);if(d<START_D)continue;const w=new Date(d+"T12:00:00").getDay();const pl=PLAN[w];const n=nutDoc(d);plan+=pl.m.length;eat+=pl.m.filter(k=>n.meals[k]).length;eau+=n.eau||0;nd++}
 if(nd){const pc=Math.round(eat/plan*100);out.push([pc>=80?"ok":"warn","Repas",pc+" % des repas prévus cochés sur "+nd+" jour(s)."+(pc<80?" Pense à cocher, ou dis-moi ce qui bloque dans le plan.":"")]);
  const L=eau/nd*0.25;out.push([L>=2.5?"ok":"warn","Eau",fmt(L)+" L par jour en moyenne"+(L<2.5?" : vise 3 L.":".")])}
 // stagnation & baisse
 const byEx={};ses.slice().reverse().forEach(s=>(s.exos||[]).forEach(e=>{if(e.charge==null&&!(e.reps||[]).some(r=>r!=null))return;(byEx[e.id]=byEx[e.id]||[]).push({d:s.date,c:e.charge,r:(e.reps||[]).reduce((a,x)=>a+(x||0),0)})}));
 const stag=[],down=[];Object.entries(byEx).forEach(([id,l])=>{if(l.length>=3){const z=l.slice(-3);if(z.every(x=>x.c===z[0].c)&&z[2].r<=z[0].r)stag.push(id)}
  if(l.length>=2){const x=l[l.length-1],y=l[l.length-2];if(x.d>since(10)&&x.c!=null&&y.c!=null&&x.c<y.c)down.push(id)}});
 if(stag.length)out.push(["warn","Exercices bloqués",stag.map(exName).join(", ")+" : aucune progression sur 3 séances. Demande une analyse coach pour changer de variante ou de fourchette."]);
 if(down.length>=2)out.push(["warn","Fatigue",down.length+" exercices en baisse de charge ("+down.map(exName).join(", ")+"). Fais une semaine allégée : mêmes exercices, moitié des séries."]);
 else if(ses.length>=4&&!stag.length)out.push(["ok","Progression","Pas d'exercice bloqué. Continue la double progression."]);
 if(wk>0&&wk%7===0)out.push(["info","Semaine allégée","Semaine "+wk+" : c'est le bon moment pour une semaine allégée si tu te sens fatigué."]);
 // ressentis
 const re=/douleur|mal |mal$|bless|tendin|gêne|gene|craqu|élanc|elanc|coinc/i;const flags=[];
 ses.filter(s=>s.date>since(14)).forEach(s=>(s.exos||[]).forEach(e=>{if(e.note&&re.test(e.note))flags.push(dfr(s.date)+" · "+e.nom+" : « "+e.note+" »")}));
 S.corps.filter(c=>c.date>since(14)&&c.note&&re.test(c.note)).forEach(c=>flags.push(dfr(c.date)+" · Corps : « "+c.note+" »"));
 if(flags.length)out.push(["bad","Douleurs signalées",flags.slice(0,5).join("\n")+"\nSi c'est une douleur articulaire, arrête l'exercice concerné et lance une analyse coach pour une variante. Si elle persiste, consulte un médecin."]);
 return out}

function buildCoachPrompt(){const t=today();const lines=[];
 const pf=S.profil||{};lines.push("Tu es le coach sportif et nutritionnel de "+(pf.prenom||"l'utilisateur")+(pf.description?" ("+pf.description+")":"")+". Objectif : recomposition corporelle (perdre du gras, garder/prendre du muscle), perte visée 0,3 à 0,6 kg/semaine.");

 lines.push("Nutrition : "+(pf.nutrition||"environ 2 550 kcal/jour en moyenne, environ 163 g de protéines."));
 lines.push("\nEXERCICES (id | nom | séries x fourchette):");
 for(const l in P)for(const k in P[l])progOf(l,k).ex.forEach(d=>lines.push(d[0]+" | "+l+" "+k+" | "+d[1]+" | "+d[2]+"x"+d[3]+"-"+d[4]));
 lines.push("\nSÉANCES RÉCENTES (28 jours) :");
 allSeances().filter(s=>s.date>addDays(t,-28)).reverse().forEach(s=>{lines.push(s.date+" "+s.lieu+" "+s.seance+" ("+(s.dureeMin||"?")+" min)");(s.exos||[]).forEach(e=>{if(e.charge==null&&!(e.reps||[]).some(r=>r!=null))return;lines.push("  "+e.id+" "+(e.charge!=null?e.charge+"kg ":"")+(e.reps||[]).map(r=>r==null?"-":r).join("/")+(e.note?" note: "+e.note:""))})});
 lines.push("\nMESURES :");[...S.corps].sort((a,b)=>a.date.localeCompare(b.date)).forEach(c=>lines.push(c.date+" poids "+(c.poids??"-")+" taille "+(c.taille??"-")+" pas "+(c.pas??"-")+(c.note?" note: "+c.note:"")));
 lines.push("\nREPAS COCHÉS / PRÉVUS (14 jours) :");for(let i=13;i>=0;i--){const d=addDays(t,-i);if(d<START_D)continue;const pl=PLAN[new Date(d+"T12:00:00").getDay()];const n=nutDoc(d);lines.push(d+" "+pl.m.filter(k=>n.meals[k]).length+"/"+pl.m.length+" eau "+fmt((n.eau||0)*0.25)+"L")}
 lines.push("\nAJUSTEMENTS DÉJÀ ACTIFS : "+JSON.stringify({charges:S.coach.charges||{},swaps:S.coach.swaps||{},kcal:S.coach.kcal||{}}));
 lines.push("BILAN AUTOMATIQUE : "+computeBilan().map(b=>b[1]+": "+b[2]).join(" | "));
 lines.push("\n[Données exportées de l'app FORGE] Analyse ces données. Si ce texte est collé dans une conversation, réponds en texte clair (analyse + propositions concrètes) ; sinon réponds UNIQUEMENT avec un objet JSON de la forme :\n{\"analyse\":\"6 à 10 phrases en français, tutoiement, ton de coach direct et bienveillant : ce qui va bien, ce qui coince, quoi faire cette semaine\",\"propositions\":[{\"type\":\"charge\",\"exId\":\"s_dcb\",\"valeur\":62.5,\"raison\":\"...\"},{\"type\":\"remplacer\",\"exId\":\"m_fbu\",\"nom\":\"nouvel exercice faisable avec le même matériel\",\"tip\":\"consigne courte\",\"raison\":\"...\"},{\"type\":\"calories\",\"valeur\":-150,\"raison\":\"...\"},{\"type\":\"conseil\",\"raison\":\"...\"}]}\nRègles : 0 à 5 propositions, seulement si les données le justifient ; exId doit être un id de la liste ; calories entre -300 et +300 (changement par rapport à l'actuel) ; ne propose une charge maison que jusqu'à 20 kg ; en cas de douleur, propose de remplacer l'exercice et conseille de consulter si elle persiste ; si peu de données, dis-le et donne des conseils de démarrage.");
 return lines.join("\n")}
async function runCoach(src){src=src==="hebdo"?"hebdo":"app";if(S.coachBusy)return;S.coachBusy=true;S.coachMsg="Je réfléchis… (30 à 60 s)";render();
 try{const sample=window.claude&&window.claude.use?await window.claude.use("sample"):null;
  if(!sample){S.coachMsg="L'analyse coach n'est pas disponible ici. Ouvre l'app depuis claude.ai ou l'app Claude, ou écris-moi « analyse mes séances » dans le chat.";return}
  const r=await sample.json(buildCoachPrompt(),{modelTier:"default"});
  const ids=ALLIDS();const props=(Array.isArray(r&&r.propositions)?r.propositions:[]).filter(p=>p&&["charge","remplacer","calories","conseil"].includes(p.type)).filter(p=>p.type==="conseil"||p.type==="calories"?true:ids.has(String(p.exId))).slice(0,5).map((p,i)=>({id:Date.now().toString(36)+i,type:p.type,exId:p.exId?String(p.exId):undefined,valeur:p.type==="calories"?Math.max(-300,Math.min(300,Math.round(Number(p.valeur)||0))):(p.type==="charge"?Number(p.valeur):undefined),nom:p.nom?String(p.nom).slice(0,80):undefined,tip:p.tip?String(p.tip).slice(0,160):undefined,raison:String(p.raison||"").slice(0,400),source:src,date:today()})).filter(p=>p.type!=="charge"||isFinite(p.valeur));
  const c=cloneCoach();c.propositions=(c.propositions||[]).concat(props);c.analyses=(c.analyses||[]).concat([{date:today(),texte:String(r&&r.analyse||"").slice(0,3000),source:src}]).slice(-10);
  S.coachMsg=String(r&&r.analyse||"");saveCoach(c)}
 catch(e){const m={not_granted:"Tu as refusé l'accès à Claude pour cette app.",rate_limited:"Trop de demandes : réessaie dans quelques minutes.",invalid_json:"La réponse n'était pas lisible : relance l'analyse.",session_expired:"Reconnecte-toi à claude.ai."};S.coachMsg=m[e&&e.code]||"L'analyse a échoué. Réessaie plus tard."}
 finally{S.coachBusy=false;render()}}
function applyProp(id,apply){const c=cloneCoach();const p=(c.propositions||[]).find(x=>x.id===id);if(!p)return;c.propositions=c.propositions.filter(x=>x.id!==id);
 if(apply){if(p.type==="charge"){c.charges=c.charges||{};c.charges[p.exId]={kg:p.valeur,date:today(),raison:p.raison}}
  else if(p.type==="remplacer"){c.swaps=c.swaps||{};c.swaps[p.exId]={nom:p.nom,tip:p.tip||"",date:today()}}
  else if(p.type==="calories"){const cur=(c.kcal&&c.kcal.delta)||0;c.kcal={delta:Math.max(-500,Math.min(500,cur+p.valeur)),note:p.raison,date:today()}}}
 c.log=(c.log||[]).concat([{date:today(),prop:p,applied:!!apply}]).slice(-50);saveCoach(c);render()}
function undoAdj(v){const [kind,id]=v.split("|");const c=cloneCoach();if(kind==="kcal")delete c.kcal;else if(c[kind])delete c[kind][id];saveCoach(c);render()}

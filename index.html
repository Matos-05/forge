<style>
:root{--bg:#0a0b0d;--card:#14161a;--card2:#1c1f25;--line:#2a2d35;--txt:#f4f5f7;--mut:#9ba1ad;--acc:#ff5a1f;--acc2:#ff8a1f;--accs:rgba(255,90,31,.16);--ok:#c4f82a;--oks:rgba(196,248,42,.14);--warn:#f59e0b;--bad:#ef4444;--bads:rgba(239,68,68,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,Roboto,sans-serif}
body{padding:0 env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;padding-top:calc(12px + env(safe-area-inset-top)) !important;background:rgba(10,11,13,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 16px 10px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--acc),var(--acc2) 55%,var(--ok)) 1}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:22px;margin:0;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.5px}

.sub{color:var(--mut);font-size:13px}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-top:10px}

main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 2px;font-size:17px;font-weight:800}
.big{display:block;width:100%;text-align:left;color:var(--txt);font:inherit;cursor:pointer}
.big .tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--acc);color:#fff;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.next{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.muted{color:var(--mut);font-size:13px}
.tip{color:var(--mut);font-size:13px;margin-top:4px}
.last{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--card2)}
.goal{font-weight:700}
.up{color:var(--ok)}.down{color:var(--bad)}.same{color:#ffc58a}
.row{display:flex;align-items:center;gap:8px}
.charge{display:flex;align-items:center;gap:8px;margin:12px 0 6px}
.charge label{font-size:13px;color:var(--mut);min-width:64px}
.step{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:22px;font-weight:600;flex:none}

.set .n{font-size:13px;color:var(--mut)}

.set.done .chk{background:var(--ok);border-color:var(--ok);color:#06130a}
.set.done .inp{border-color:rgba(196,248,42,.55)}
.btn{display:block;width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:17px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;margin-top:6px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);text-transform:none;letter-spacing:0;font-weight:700}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(239,68,68,.4);text-transform:none;letter-spacing:0}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(10,11,13,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:transparent;color:var(--mut);font-size:12px;font-weight:600;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc)}
#gate{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
.gwrap{max-width:520px;margin:0 auto}
.flab{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
.fin{display:block;width:100%;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:#0b0d11;color:var(--txt);font-size:16px;padding:0 12px;font-family:inherit;-webkit-appearance:none;appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;cursor:pointer;max-width:100%}
.chip input{accent-color:var(--acc);margin:0;flex:none;width:18px;height:18px}
.chip:has(input:checked){border-color:var(--acc);background:var(--accs)}
.feel{display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px 8px;align-items:center;margin-top:10px}
.chips.sm{gap:5px}
.fc{border:1px solid var(--line);background:var(--card2);color:var(--mut);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:600;font-family:inherit}
.fc.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fc.bad.on{background:var(--bad);border-color:var(--bad)}
#timer{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:7;background:#2a1208;border:1px solid var(--acc);border-radius:16px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:620px;margin:0 auto}
#timer.show{display:flex}
#timer.end{background:#1d2608;border-color:var(--ok)}
#tval{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:86px}
#timer .lbl{flex:1;font-size:13px;color:var(--mut);line-height:1.2}
#timer button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-weight:700;padding:0 10px}
.status{font-size:12px;padding:8px 12px;border-radius:10px;margin-bottom:12px;background:var(--card2);color:var(--mut)}
.status.warn{background:rgba(245,158,11,.12);color:#fbbf24}
.hist summary{list-style:none;cursor:pointer}
.hist summary::-webkit-details-marker{display:none}
.hl{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.hl:first-child{border-top:0}
.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:22px;font-weight:900;font-style:italic;color:var(--ok)}
.kpi span{font-size:12px;color:var(--mut)}
.form2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.form2>div{min-width:0}
.form2 .inp{width:100%;min-width:0;display:block}
input[type=date].inp{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;width:100%;text-align:center;padding:0 6px}
html,body{max-width:100%;overflow-x:hidden}
main,.card{min-width:0}
select.inp{min-width:0;width:100%;-webkit-appearance:none;appearance:none;text-align:center}
.form2 label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px}
.pill.up{background:var(--oks)}.pill.down{background:var(--bads)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:85vh;overflow:auto}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.progress{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.progress.p i{background:var(--ok)}
.meal{display:flex;gap:12px;align-items:flex-start}
.meal .box{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:transparent;color:transparent;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center}
.meal.on .box{background:var(--ok);border-color:var(--ok);color:#06130a}
.meal.on h3{text-decoration:line-through;color:var(--mut)}
.meal ul{margin:6px 0 0;padding-left:18px;color:var(--mut);font-size:13px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.daynav b{font-size:16px;text-align:center;flex:1}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.badge.s{background:var(--accs);color:#ff9a6b}.badge.r{background:rgba(245,158,11,.15);color:#fbbf24}
.water{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.water span{width:22px;height:30px;border-radius:4px 4px 8px 8px;border:2px solid #38bdf8;opacity:.35}
.water span.f{background:#38bdf8;opacity:1}
.cl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.cl:first-of-type{border-top:0}
.cl .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:transparent}
.cl.on .box{background:var(--ok);border-color:var(--ok);color:#06130a}
.cl.on .t{text-decoration:line-through;color:var(--mut)}
.cl .q{margin-left:auto;color:var(--mut);font-size:13px;text-align:right}
</style>

<body>
<header>
  <div class="hrow"><div><h1 id="title">For<b>ge</b></h1><div class="sub" id="weekInfo"></div></div><button class="sub" id="sync" style="background:none;border:0;color:var(--mut);font:inherit;font-size:13px;padding:6px 0"></button></div>
  <div class="seg" id="lieuSeg"><button data-l="salle">Salle</button><button data-l="maison">Maison</button></div>
</header>
<main id="main"></main>
<div id="timer"><div id="tval">0:00</div><div class="lbl" id="tlbl">Repos</div><button id="tplus">+30 s</button><button id="tskip">OK</button></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<nav id="nav">
  <button data-v="seance" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Séance</button>
  <button data-v="repas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3 4-3 7h3"/></svg>Repas</button>
  <button data-v="courses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11.2L21 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="18" cy="19.5" r="1.5"/></svg>Courses</button>
  <button data-v="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Progrès</button>
  <button data-v="corps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Corps</button>
</nav>
<script>
(function(){
"use strict";
// ---------- Programme ----------
// [id, nom, séries, min, max, repos(s), incrément(kg), type, consigne]
// type: b=barre, h=haltère (kg par haltère), m=machine, c=poids du corps, s=secondes, e=élastique

// ---------- Stockage local + synchronisation Cloudflare ----------
const LDB={docs:{},listeners:[]};
try{LDB.docs=JSON.parse(localStorage.getItem("forge_docs")||"{}")}catch(e){LDB.docs={}}
function ldbSave(){try{localStorage.setItem("forge_docs",JSON.stringify(LDB.docs))}catch(e){}}
function ldbNotify(){LDB.listeners.slice().forEach(l=>{try{l()}catch(e){console.error(e)}})}
function ldbPut(path,data){LDB.docs[path]={data:data,updatedAt:Math.max(Date.now(),((LDB.docs[path]||{}).updatedAt||0)+1),dirty:true};ldbSave();ldbNotify();scheduleSync()}
function mkSnapDoc(path){const r=LDB.docs[path];const ex=!!(r&&!r.deleted&&r.data);const d=ex?JSON.parse(JSON.stringify(r.data)):undefined;return {id:path.split("/").pop(),exists:ex,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}}
function ldbQuery(col,ord,lim){const n=col.split("/").length+1;let arr=Object.keys(LDB.docs).filter(p=>p.startsWith(col+"/")&&p.split("/").length===n&&!LDB.docs[p].deleted&&LDB.docs[p].data).map(mkSnapDoc);
 if(ord)arr.sort((a,b)=>{const x=a.data()[ord.f],y=b.data()[ord.f];return (x<y?-1:x>y?1:0)*(ord.d==="desc"?-1:1)});if(lim)arr=arr.slice(0,lim);
 return {docs:arr,size:arr.length,empty:!arr.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}}
const LocalDB={
 doc(path){return {set:async d=>ldbPut(path,JSON.parse(JSON.stringify(d))),get:async()=>mkSnapDoc(path),onSnapshot(cb){const f=()=>cb(mkSnapDoc(path));LDB.listeners.push(f);setTimeout(f,0);return()=>{LDB.listeners=LDB.listeners.filter(x=>x!==f)}}}},
 collection(col){const q=(ord,lim)=>({orderBy:(f,d)=>q({f:f,d:d},lim),limit:n=>q(ord,n),get:async()=>ldbQuery(col,ord,lim),onSnapshot(cb){const f=()=>cb(ldbQuery(col,ord,lim));LDB.listeners.push(f);setTimeout(f,0);return()=>{LDB.listeners=LDB.listeners.filter(x=>x!==f)}},doc:id=>LocalDB.doc(col+"/"+id)});return q(null,null)}
};
const SY={token:localStorage.getItem("forge_session")||"",since:+(localStorage.getItem("forge_since")||0),state:"idle",lastOk:+(localStorage.getItem("forge_lastok")||0)};
let syT=null;function scheduleSync(){clearTimeout(syT);syT=setTimeout(doSync,1500)}
async function doSync(){
 if(!SY.token){SY.state="notoken";setStatus();return}
 if(SY.state==="busy")return;
 if(navigator.onLine===false){SY.state="offline";setStatus();return}
 SY.state="busy";setStatus();
 const dirty=Object.entries(LDB.docs).filter(([p,r])=>r.dirty).map(([p,r])=>({path:p,data:r.data,updatedAt:r.updatedAt,deleted:!!r.deleted}));
 try{
  const res=await fetch("/api/sync",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+SY.token},body:JSON.stringify({since:SY.since,docs:dirty})});
  if(res.status===401){SY.state="badtoken";setStatus();if(SY.token){AU.token="";SY.token="";localStorage.removeItem("forge_session");showAuth("Ta session a expiré : reconnecte-toi.")}return}
  if(!res.ok)throw new Error("HTTP "+res.status);
  const j=await res.json();
  dirty.forEach(d=>{const r=LDB.docs[d.path];if(r&&r.updatedAt===d.updatedAt)r.dirty=false});
  let changed=false;
  (j.docs||[]).forEach(d=>{const r=LDB.docs[d.path];if(!r||d.updatedAt>r.updatedAt){LDB.docs[d.path]={data:d.data,updatedAt:d.updatedAt,dirty:false,deleted:d.deleted||undefined};changed=true}});
  SY.since=Math.max(0,(j.now||Date.now())-5000);localStorage.setItem("forge_since",SY.since);
  SY.lastOk=Date.now();localStorage.setItem("forge_lastok",SY.lastOk);
  ldbSave();SY.state="ok";if(changed)ldbNotify();
 }catch(e){SY.state="offline"}
 setStatus()}
window.addEventListener("online",()=>doSync());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")doSync()});
setInterval(()=>{if(document.visibilityState==="visible")doSync()},60000);
function showSettings(){showModal('<h3>Synchronisation</h3><p class="muted">L\'app fonctionne sans réseau. Dès que tu as du réseau, elle envoie tes données sur ton serveur Cloudflare : c\'est ta sauvegarde, et c\'est ce qui me permet de les analyser.</p><label class="muted">Code de synchronisation</label><input class="inp" id="tokIn" value="'+esc(SY.token)+'" placeholder="FRG-XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off" style="font-size:16px;margin:6px 0 10px;text-align:left;padding:0 12px"><button class="btn" id="tokSave">Enregistrer et synchroniser</button><p class="muted" style="margin-top:10px">Dernière synchro réussie : '+(SY.lastOk?new Date(SY.lastOk).toLocaleString("fr-FR"):"jamais")+'</p><button class="btn sec" id="syncNow">Synchroniser maintenant</button><button class="btn sec" id="expBtn" style="margin-top:8px">Copier une sauvegarde (JSON)</button><button class="btn sec" data-close style="margin-top:8px">Fermer</button>')}
async function copyText(t,okMsg){try{await navigator.clipboard.writeText(t);showModal('<h3>Copié ✅</h3><p class="muted">'+okMsg+'</p><button class="btn" data-close>OK</button>')}catch(e){showModal('<h3>Copie impossible</h3><p class="muted">Sélectionne le texte ci-dessous et copie-le.</p><textarea class="note" style="min-height:200px">'+esc(t)+'</textarea><button class="btn sec" data-close>Fermer</button>')}}

let P={
salle:{
 HA:{nom:"Haut A — Force",ex:[
  ["s_dcb","Développé couché à la barre",4,6,8,150,2.5,"b","Omoplates serrées, coudes à 45°, descente 2-3 s"],

  ["s_dmh","Développé militaire haltères assis",3,8,10,120,2,"h","Dos collé au dossier, abdos gainés"],
  ["s_tvl","Tirage vertical prise large",3,8,10,120,2.5,"m","Tire vers le haut de la poitrine"],
  ["s_cha","Curl haltères alterné",3,10,12,75,1,"h","Coudes fixes, pas d'élan"],
  ["s_etp","Extension triceps poulie haute (corde)",3,10,12,75,2.5,"m","Seuls les avant-bras bougent"]]},
 BA:{nom:"Bas A — Force",ex:[
  ["s_sqb","Squat à la barre",4,6,8,180,2.5,"b","Hanches en arrière, cuisses parallèles, dos neutre"],
  ["s_sdr","Soulevé de terre roumain barre",3,8,10,150,2.5,"b","Dos plat, barre près des jambes"],
  ["s_pre","Presse à cuisses",3,10,12,120,5,"m","90° aux genoux, ne verrouille pas"],
  ["s_lgc","Leg curl",3,10,12,90,2.5,"m","Lent, pause 1 s en contraction"],
  ["s_mol","Mollets debout",4,12,15,60,5,"m","Amplitude complète, pause en bas"],
  ["s_pla","Planche (secondes)",3,40,60,60,0,"s","Bassin aligné, abdos serrés"]]},
 HB:{nom:"Haut B — Volume",ex:[
  ["s_dih","Développé incliné haltères (30°)",4,8,12,120,2,"h","Mêmes repères que le couché"],
  ["s_thp","Tirage horizontal poulie prise serrée",4,10,12,120,2.5,"m","Poitrine sortie, serre les omoplates"],
  ["s_elh","Élévations latérales haltères",4,12,15,60,1,"h","Jusqu'à l'horizontale, charge légère"],
  ["s_tvs","Tirage vertical prise serrée neutre",3,10,12,90,2.5,"m","Coudes vers les hanches"],
  ["s_pec","Écarté machine (pec deck)",3,12,15,60,2.5,"m","Bras légèrement fléchis"],
  ["s_fpu","Face pull poulie (corde)",3,15,15,60,2.5,"m","Vers le front, coudes hauts"],
  ["s_cma","Curl marteau",3,10,12,40,1,"h","Superset avec la barre au front"],
  ["s_baf","Barre au front",3,10,12,75,2.5,"b","Coudes serrés et fixes"]]},
 BB:{nom:"Bas B — Volume",ex:[
  ["s_hit","Hip thrust barre ou machine",4,8,12,120,5,"b","Serre les fessiers 1 s en haut"],

async function runCoach(src){src=src==="hebdo"?"hebdo":"app";if(S.coachBusy)return;S.coachBusy=true;S.coachMsg="Je réfléchis… (30 à 60 s)";render();

  if(!sample){S.coachMsg="L'analyse coach n'est pas disponible ici. Ouvre l'app depuis claude.ai ou l'app Claude, ou écris-moi « analyse mes séances » dans le chat.";return}
  const r=await sample.json(buildCoachPrompt(),{modelTier:"default"});
  const ids=ALLIDS();const props=(Array.isArray(r&&r.propositions)?r.propositions:[]).filter(p=>p&&["charge","remplacer","calories","conseil"].includes(p.type)).filter(p=>p.type==="conseil"||p.type==="calories"?true:ids.has(String(p.exId))).slice(0,5).map((p,i)=>({id:Date.now().toString(36)+i,type:p.type,exId:p.exId?String(p.exId):undefined,valeur:p.type==="calories"?Math.max(-300,Math.min(300,Math.round(Number(p.valeur)||0))):(p.type==="charge"?Number(p.valeur):undefined),nom:p.nom?String(p.nom).slice(0,80):undefined,tip:p.tip?String(p.tip).slice(0,160):undefined,raison:String(p.raison||"").slice(0,400),source:src,date:today()})).filter(p=>p.type!=="charge"||isFinite(p.valeur));

 finally{S.coachBusy=false;render()}}

const MILESTONES=[3,7,14,21,30,50,84,100];
function dayStatus(d){const wd=new Date(d+"T12:00:00").getDay();const pl=dayPlan(d);
 const ses=allSeances().filter(s=>s.date===d).length;if(ses)return "ok";
 const n=nutDoc(d);const eaten=pl.m.filter(k=>n.meals&&n.meals[k]).length;const mealsOk=eaten>=3;
 if(pl.t==="r"&&mealsOk)return "ok";
 if(mealsOk){const mon=addDays(d,wd===0?-6:1-wd);const weekSes=allSeances().filter(s=>s.date>=mon&&s.date<=d).length;if(weekSes>=ORDER.length)return "ok"}
 return "miss"}
function computeStreak(){const t=today();const res={cur:0,best:0,days:{},jokerUsedThisWeek:false};if(t<START_D)return res;
 let cur=0,best=0,jokerWeek=null;
 for(let d=START_D;d<=t;d=addDays(d,1)){const wd=new Date(d+"T12:00:00").getDay();const mon=addDays(d,wd===0?-6:1-wd);let st=dayStatus(d);
  if(st==="miss"&&d===t){res.days[d]="pending";continue}
  if(st==="miss"&&jokerWeek!==mon&&cur>0){st="joker";jokerWeek=mon}
  res.days[d]=st;
  if(st==="ok"){cur++;best=Math.max(best,cur)}else if(st==="miss"){cur=0}}
 res.cur=cur;res.best=best;const wdT=new Date(t+"T12:00:00").getDay();res.jokerUsedThisWeek=jokerWeek===addDays(t,wdT===0?-6:1-wdT);return res}
function todayGoal(){const t=today();if(t<START_D)return null;const wd=new Date(t+"T12:00:00").getDay();const pl=dayPlan(t);const st=dayStatus(t);

 if(st==="ok")return {done:true,txt:"Journée validée ✅ Ta série continue."};
 return {done:false,txt:pl.t==="s"?"Jour de séance : enregistre ta séance pour valider ta journée.":"Jour de repos : coche au moins 3 repas sur 4 pour valider ta journée ("+eaten+"/4).",eaten}}

function autoAdapt(doc){const c=cloneCoach();const msgs=[];const t=today();c.charges=c.charges||{};c.swaps=c.swaps||{};c.reps=c.reps||{};
 (doc.exos||[]).forEach(e=>{const def=exDefById(e.id)||EXL[e.id];if(!def)return;const h=exHistory(e.id);
  const rel=e.pain==="dos"||(e.pain==="genou"&&LOWER.has(e.id))||(["epaule","coude","poignet"].includes(e.pain)&&!LOWER.has(e.id))||(["epaule","coude","poignet"].includes(e.pain)&&LOWER.has(e.id)&&!["h","b"].includes(def[7]));
  if(e.pain&&!rel){if(e.charge&&["h","b"].includes(def[7])){c.charges[e.id]={kg:Math.round(e.charge*0.8*2)/2,date:t,raison:"douleur "+zoneLbl(e.pain)+" en portant la charge",auto:1};msgs.push("🩹 "+def[1]+" : charge baissée à "+fmt(c.charges[e.id].kg)+" kg (douleur "+zoneLbl(e.pain)+")")}else msgs.push("🩹 Douleur "+zoneLbl(e.pain)+" notée sur "+def[1]+" : surveille-la.")}
  else if(e.pain&&!c.swaps[e.id]){const g=GENTLE[e.id];if(g){c.swaps[e.id]={nom:g[0],tip:g[1],fiche:g[2],date:t,auto:1,raison:"douleur "+e.pain};msgs.push("🩹 "+def[1]+" → "+g[0]+" (douleur "+zoneLbl(e.pain)+")")}
   else if(e.charge){c.charges[e.id]={kg:Math.round(e.charge*0.8*2)/2,date:t,raison:"douleur "+zoneLbl(e.pain)+" : charge réduite de 20 %",auto:1};msgs.push("🩹 "+def[1]+" : charge baissée à "+fmt(c.charges[e.id].kg)+" kg (douleur)")}}
  const lastTwo=h.slice(-2);
  if(lastTwo.length===2&&lastTwo.every(x=>x.diff==="tropdur")&&e.charge&&def[6]){const kg=Math.max(0,Math.round((e.charge-def[6])*10)/10);c.charges[e.id]={kg:kg,date:t,raison:"« trop dur » 2 fois de suite",auto:1};msgs.push("⬇️ "+def[1]+" : "+fmt(kg)+" kg la prochaine fois (trop dur 2 fois)")}
  if(GEN&&h.length>=3&&!c.reps[e.id]){const z=h.slice(-3);const vol=x=>(x.reps||[]).reduce((a,r)=>a+(r||0),0);
   if(z.every(x=>x.charge===z[0].charge)&&vol(z[2])<=vol(z[0])&&def[7]!=="s"&&def[7]!=="c"){c.reps[e.id]={min:def[3]+2,max:def[4]+3,date:t,auto:1,raison:"bloqué 3 séances"};if(c.charges[e.id]&&c.charges[e.id].auto)delete c.charges[e.id];
    if(z[2].charge){c.charges[e.id]={kg:Math.max(0,Math.round((z[2].charge-(def[6]||0))*10)/10),date:t,raison:"nouvelle fourchette, charge un peu plus légère",auto:1}}
    msgs.push("🔁 "+def[1]+" : bloqué 3 séances → passe à "+(def[3]+2)+"-"+(def[4]+3)+" reps")}}});
 if(msgs.length){c.log=(c.log||[]).concat(msgs.map(m=>({date:t,auto:m}))).slice(-50);saveCoach(c)}
 return msgs}

function mealSwapped(wd,i,base){const sw=menuSwaps()[wd+"|"+i];if(!sw||!MB[sw])return null;const k=swapKey(wd,i);
 if(!M[k]||M[k]._src!==sw+"|"+base){const ex=exclNow();const r=scaleTo(libMeal(sw,ex),M[base].k);r.nom=(i===1?"Déjeuner · ":"Dîner · ")+strip(MB[sw].nom);r.bc=false;r._src=sw+"|"+base;r.swapped=1;M[k]=r}return k}
function dayPlan(d){const wd=new Date(d+"T12:00:00").getDay();const b=PLAN[wd];const o=weekOv(d);
 return {t:o?(o.days.includes(wd)?"s":"r"):b.t,m:b.m.map((k,i)=>mealSwapped(wd,i,k)||k),base:b.m}}
function showSwap(d,i){const wd=new Date(d+"T12:00:00").getDay();const base=PLAN[wd].m[i];const cur=menuSwaps()[wd+"|"+i];const ex=exclNow();const kc=M[base].k;
 const opts=LIB.filter(x=>(i===1?x[1]:x[2])&&libOk(x[0],ex));
 let h='<h3>Changer de '+(i===1?"déjeuner":"dîner")+'</h3><p class="muted">Pour chaque '+JOURS[wd].toLowerCase()+'. Les quantités sont ajustées pour garder environ '+kc+' kcal, et la liste de courses suit.</p>';
 if(cur)h+='<button class="btn sec" data-swset="'+wd+'|'+i+'|" style="margin-bottom:10px">↩︎ Revenir au plat prévu : '+esc(strip(M[base].nom))+'</button>';
 opts.forEach(([k])=>{const r=scaleTo(libMeal(k,ex),kc);const on=cur===k;
  h+='<button class="card big" data-swset="'+wd+'|'+i+'|'+k+'" style="margin-bottom:8px;text-align:left'+(on?';border-color:var(--acc)':'')+'"><b>'+esc(strip(MB[k].nom))+(on?' ✓':'')+'</b><div class="muted">'+r.k+' kcal · '+r.p+' g de protéines'+(MB[k].bc?' · se prépare en batch':'')+'</div></button>'});
 showModal(h+'<button class="btn sec" data-close>Fermer</button>')}
function setSwap(spec){const [wd,i,k]=spec.split("|");const doc=Object.assign({},getDocData("config/menu")||{});const sw=Object.assign({},doc.swaps||{});
 if(k)sw[wd+"|"+i]=k;else delete sw[wd+"|"+i];doc.swaps=sw;ldbPut("config/menu",doc);$("#modal").classList.remove("show");render()}
// Liste de courses calculée sur les plats de la semaine
function weekFoods(onlySwapped){const tot={};for(let w=0;w<7;w++){const d=addDays(mondayOf(planDay()),w);dayPlan(d).m.forEach(k=>{const m=M[k];if(!m||!m.q||(onlySwapped&&!m.swapped))return;m.q.forEach(([id,q])=>{tot[id]=(tot[id]||0)+q})})}return tot}
function foodsToItems(tot,pre){const ordR=["Frais","Viande / poisson","Surgelés","Épicerie","Fruits et légumes"];
 return Object.entries(tot).map(([id,q])=>{const F=FOOD[id];let s;if(F[3]){const n=Math.round(q/F[3]);s=n+" "+(n>1?F[5]:F[4])}else s=q>=1000?fmt(Math.ceil(q/100)/10)+" kg":(Math.ceil(q/50)*50)+" g";
  const lab=(F[3]?F[5]:F[4]);return {k:pre+id,r:F[2],n:lab.charAt(0).toUpperCase()+lab.slice(1),q:s}}).sort((a,b)=>ordR.indexOf(a.r)-ordR.indexOf(b.r)||a.n.localeCompare(b.n))}

 '<div class="card"><h3>Qu\'est-ce que tu veux cibler ?</h3><div class="muted" style="font-size:13px;margin-bottom:8px">Plusieurs choix possibles.</div><div class="chips">'+FOCUS.map(f=>'<label class="chip"><input type="checkbox" name="wFoc" value="'+f[0]+'"'+(((o&&o.focus)||["equilibre"]).includes(f[0])?" checked":"")+'><span>'+f[1]+'</span></label>').join('')+'</div></div>'+
 '<div class="card"><h3>Temps max par séance</h3>'+radio("wDur",[[30,"30 min"],[45,"45 min"],[60,"1 h"],[75,"1 h 15"],[90,"1 h 30"]],o?o.duree:60)+'</div>'+
 (lieux.length>1?'<div class="card"><h3>Où cette semaine ?</h3>'+radio("wLieu",lieux.map(l=>[l,l==="salle"?"En salle":"À la maison"]),pfL)+'</div>':'')+

 gate(h);const upd=()=>{const n=document.querySelectorAll('input[name=wDay]:checked').length;$("#wN").textContent=n?n+" séance"+(n>1?"s":"")+" cette semaine":"Coche au moins un jour."};upd();

function saveWeek(o){const doc=Object.assign({},getDocData("config/week")||{});const w=Object.assign({},doc.weeks||{});const mon=mondayOf(today());
 if(o)w[mon]=o;else w[mon]={normal:true,date:today()};Object.keys(w).sort().slice(0,-8).forEach(k=>delete w[k]);doc.weeks=w;ldbPut("config/week",doc);applyWeek()}

 const wp=weekPlan({days:days,focus:focus,duree:duree});const o={days:days,focus:focus,duree:duree,lieu:lieu,P:wp.P,ORDER:wp.ORDER,kcal:wp.kcal,date:today()};
 saveWeek(o);S.lieu=lieu;LS.set("lieu",lieu);hideGate();S.view="seance";render();

function weekCardHTML(){const t=today();const o=weekOv(t);const all=(getDocData("config/week")||{}).weeks||{};const cur=all[mondayOf(t)];
 const prev=all[addDays(mondayOf(t),-7)];

 if(t.id==="wKeep"){const all=(getDocData("config/week")||{}).weeks||{};const p=all[addDays(mondayOf(today()),-7)];const wp=weekPlan({days:p.days,focus:p.focus,duree:p.duree});saveWeek(Object.assign({},p,{P:wp.P,ORDER:wp.ORDER,kcal:wp.kcal,date:today()}));render();return}
 if(t.dataset.swap){e.stopPropagation();const [d,i]=t.dataset.swap.split("|");showSwap(d,+i);return}

// ---------- Séance active ----------
function startSession(k){const ex=progOf(S.lieu,k).ex;
 S.active={id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),lieu:S.lieu,seance:k,date:today(),startedAt:new Date().toISOString(),
  exos:ex.map(d=>{const adv=advice(d,lastFor(d[0]));return {charge:null,reps:Array(d[2]).fill(null),done:Array(d[2]).fill(false),note:"",sug:adv.charge}})};
 LS.set("active",S.active);window.scrollTo(0,0);render()}
function saveActive(){LS.set("active",S.active)}
async function finish(){const a=S.active;const prog=progOf(a.lieu,a.seance);
 const exos=prog.ex.map((d,i)=>({id:d[0],nom:d[1],charge:a.exos[i].charge,reps:a.exos[i].reps,note:a.exos[i].note||"",diff:a.exos[i].diff||"",pain:a.exos[i].pain||""}));
 if(!exos.some(e=>e.reps.some(r=>r!=null))){showModal('<h3>Rien à enregistrer</h3><p class="muted">Aucune série n\'a été remplie.</p><button class="btn sec" data-close>OK</button>');return}
 const doc={id:a.id,lieu:a.lieu,seance:a.seance,nom:prog.nom,date:a.date,semaine:weekOf(a.date),startedAt:a.startedAt,createdAt:new Date().toISOString(),dureeMin:Math.round((Date.now()-new Date(a.startedAt))/60000),exos};
 pending=pending.filter(p=>p.id!==doc.id).concat([doc]);LS.set("pending",pending);
 S.active=null;LS.set("active",null);stopTimer();
 const ups=prog.ex.filter((d,i)=>{const r=exos[i].reps.filter(x=>x!=null);return r.length>=d[2]&&r.every(x=>x>=d[4])}).map(d=>d[1]);
 const adapt=autoAdapt(doc);
 const stk=computeStreak();showModal('<h3>Séance enregistrée 💪</h3>'+(adapt.length?'<div class="last" style="margin-bottom:10px"><b>Ajusté pour la prochaine fois :</b><br>'+adapt.map(esc).join('<br>')+(adapt.some(x=>x.startsWith('🩹'))?'<br><span class="muted">Si la douleur revient ou persiste, consulte un médecin ou un kiné.</span>':'')+'</div>':'')+'<p style="font-size:18px;font-weight:800">🔥 Journée validée · série de '+stk.cur+' jour'+(stk.cur>1?'s':'')+(MILESTONES.includes(stk.cur)?' 🏆':'')+'</p><p class="muted">'+doc.dureeMin+' min · '+exos.filter(e=>e.reps.some(r=>r!=null)).length+' exercices.</p>'+(ups.length?'<p><b class="up">À augmenter la prochaine fois :</b><br>'+ups.map(esc).join('<br>')+'</p>':'<p class="muted">Garde les mêmes charges et vise +1 rep la prochaine fois.</p>')+'<button class="btn" data-close>Super</button>');
 render();flush()}
async function flush(){if(!db||!pending.length)return;
 for(const p of [...pending]){try{await db.collection("seances").doc(p.id).set(p);pending=pending.filter(x=>x.id!==p.id);LS.set("pending",pending)}catch(e){if(e&&e.code==="unavailable"){setTimeout(flush,4000)}break}}
 render()}

// ---------- Minuteur ----------
let tEnd=0,tInt=null,actx=null;
function beep(at){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime+Math.max(0,at);[0,0.25,0.5].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;g.gain.setValueAtTime(0.0001,t0+o);g.gain.exponentialRampToValueAtTime(0.4,t0+o+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+o+0.18);os.connect(g);g.connect(actx.destination);os.start(t0+o);os.stop(t0+o+0.2)})}catch(e){}}
let beepTimer=null;
function startTimer(sec,label){tEnd=Date.now()+sec*1000;$("#tlbl").textContent=label;$("#timer").classList.add("show");$("#timer").classList.remove("end");
 try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}
 clearTimeout(beepTimer);beepTimer=setTimeout(()=>beep(0),sec*1000);
 clearInterval(tInt);tInt=setInterval(tick,250);tick()}
function tick(){const r=Math.round((tEnd-Date.now())/1000);const v=Math.abs(r);$("#tval").textContent=(r<0?"+":"")+Math.floor(v/60)+":"+String(v%60).padStart(2,"0");
 if(r<=0){$("#timer").classList.add("end");$("#tlbl").textContent="C'est reparti !"}}
function stopTimer(){clearInterval(tInt);clearTimeout(beepTimer);$("#timer").classList.remove("show")}

 if(t.id==="finish"){finish();return}
 if(t.id==="cancel"){showModal('<h3>Abandonner la séance ?</h3><p class="muted">Ce que tu as saisi sera perdu.</p><button class="btn danger" data-confirm-cancel>Oui, abandonner</button><button class="btn sec" data-close style="margin-top:8px">Continuer la séance</button>');return}
 if(t.id==="tplus"){tEnd+=30000;clearTimeout(beepTimer);beepTimer=setTimeout(()=>beep(0),Math.max(0,tEnd-Date.now()));$("#timer").classList.remove("end");tick();return}
 if(t.id==="tskip"){stopTimer();return}
 if(t.id==="cSave"){saveCorps();return}
});
document.addEventListener("input",e=>{const t=e.target,a=S.active;if(!a)return;
 if(t.dataset.chin!=null){a.exos[+t.dataset.chin].charge=num(t.value);saveActive()}
 else if(t.dataset.rin){const [i,k]=t.dataset.rin.split("_").map(Number);const v=num(t.value);a.exos[i].reps[k]=v==null?null:Math.round(v);saveActive()}
 else if(t.dataset.note!=null){a.exos[+t.dataset.note].note=t.value;saveActive()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.phpose){addPhoto(t);return}if(t.id==="phDate"){PH.date=t.value;fillPhotos();return}if(t.id==="phA"){PH.cmpA=t.value;fillPhotos();return}if(t.id==="phB"){PH.cmpB=t.value;fillPhotos();return}if(t.id==="perfSel"){S.perfEx=t.value;render();return}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="adN"||e.target.id==="adQ")){e.preventDefault();const b=$("#adB");if(b)b.click()}});
document.addEventListener("focusin",e=>{if(e.target.classList.contains("inp")&&e.target.select)setTimeout(()=>{try{e.target.select()}catch(x){}},0)});

// ---------- Démarrage ----------
const applied={sig:null};applyPlan(getDocData("config/plan"));
S.repasDate=planDay();
render();checkGate();
(async()=>{
 const timeout=setTimeout(()=>{if(S.dbState==="loading"){S.dbState="off";render()}},10000);
 db=LocalDB;
 if(!db){clearTimeout(timeout);S.dbState="off";render();return}
 db.collection("seances").orderBy("date","desc").limit(500).onSnapshot(snap=>{clearTimeout(timeout);S.seances=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(!snap.metadata.fromCache)S.dbState="ok";
  const ids=new Set(S.seances.map(s=>s.id));if(!snap.metadata.hasPendingWrites){const before=pending.length;pending=pending.filter(p=>!ids.has(p.id));if(pending.length!==before)LS.set("pending",pending)}
  if(!(S.active&&S.view==="seance"))render();else setStatus()},err=>{clearTimeout(timeout);S.dbState="off";render()});
 db.collection("corps").orderBy("date","desc").limit(200).onSnapshot(snap=>{S.corps=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(!(S.active&&S.view==="seance"))render()},()=>{});
 db.collection("nutrition").orderBy("date","desc").limit(120).onSnapshot(snap=>{snap.docs.forEach(d=>{S.nut[d.id]=d.data()});LS.set("nut",S.nut);if(!(S.active&&S.view==="seance")&&S.view!=="corps")render();else setStatus()},()=>{});
 db.doc("config/profil").onSnapshot(snap=>{if(snap.exists){S.profil=snap.data();LS.set("profil",S.profil)}},()=>{});
 db.doc("config/plan").onSnapshot(snap=>{const pl=snap.exists?snap.data():null;const sig=pl?JSON.stringify(pl).length+"|"+pl.date+"|"+pl.START_D:"";if(sig!==applied.sig){applied.sig=sig;applyPlan(pl);if(!(S.active&&S.view==="seance"))render()}},()=>{});
 db.doc("config/coach").onSnapshot(snap=>{if(snap.exists){S.coach=snap.data();LS.set("coach",S.coach);if(S.view!=="seance"||!S.active)render()}},()=>{});
 db.doc("courses/liste").onSnapshot(snap=>{if(snap.exists){S.courses=snap.data();LS.set("courses",S.courses);if(S.view==="repas")render()}},()=>{});
 S.dbState="ok";flush();doSync();
 if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
})();
})();
</script>
</body>
</html>
